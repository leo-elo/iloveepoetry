---
layout: default
---

<article class="page-content">
  <div class="container">
    <h1 class="page-title">{{ page.title }}</h1>
    <div class="page-body">
      {{ content }}
    </div>

    {% if page.translation %}
    <div class="post-translation">
      {% if page.lang == 'es' %}
        <a href="{{ page.translation | relative_url }}" class="translation-link">Read in English</a>
      {% else %}
        <a href="{{ page.translation | relative_url }}" class="translation-link">Leer en Español</a>
      {% endif %}
    </div>
    {% endif %}
  </div>
</article>
