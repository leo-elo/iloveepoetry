<div style="text-align: center; padding: 3rem 1rem;">
    <h1>Page Not Found</h1>
    <p id="redirect-message">The page you're looking for doesn't exist or has moved.</p>
    <p>Try browsing from the <a href="{{ '/en/' | relative_url }}">English homepage</a> or <a href="{{ '/es/' | relative_url }}">Spanish homepage</a>.</p>
    <p>Or use the search bar below to find what you're looking for.</p>
</div>

<script>
// Attempt to redirect old WordPress URLs to new Jekyll URLs
(function() {
    var urlMap = null;

    // Try to load URL map
    fetch('{{ "/assets/url_map.json" | relative_url }}')
        .then(function(resp) { return resp.json(); })
        .then(function(data) {
            urlMap = data;
            attemptRedirect();
        })
        .catch(function() {
            // URL map not available, just show 404
        });

    function attemptRedirect() {
        if (!urlMap) return;

        var baseurl = '{{ site.baseurl }}';
        var path = window.location.pathname;
        var search = window.location.search;
        var params = new URLSearchParams(search);

        // Try ?p=ID redirect
        if (params.has('p')) {
            var postId = params.get('p');
            var key = 'p_' + postId;
            if (urlMap[key]) {
                showRedirect(baseurl + urlMap[key]);
                return;
            }
        }

        // Try slug-based redirect
        var slug = path.replace(baseurl, '').replace(/^\/+|\/+$/g, '');
        if (slug) {
            var key = 'slug/' + slug;
            if (urlMap[key]) {
                showRedirect(baseurl + urlMap[key]);
                return;
            }
            // Try just the last segment
            var parts = slug.split('/');
            var lastSlug = parts[parts.length - 1];
            key = 'slug/' + lastSlug;
            if (urlMap[key]) {
                showRedirect(baseurl + urlMap[key]);
                return;
            }
        }
    }

    function showRedirect(newUrl) {
        var msg = document.getElementById('redirect-message');
        msg.innerHTML = 'Redirecting to <a href="' + newUrl + '">' + newUrl + '</a>...';
        setTimeout(function() {
            window.location.href = newUrl;
        }, 1500);
    }
})();
</script>
